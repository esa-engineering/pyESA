title: Refresh
tooltip: >-
  Scope from the selection: with MEP elements or openings already selected, only the openings linked to them (through
  e_GEN_PFV_ID); with nothing selected, choose all the openings or those of the walls, floors and structure you select.

  Openings whose MEP elements moved out of them (partly, or away but still crossing the same way) are listed first:
  tick the openings to move onto their elements (centred on them, or by the least needed for all of them to fit with
  the clearance when the opening is shared; sizes and MEP elements are not changed); then they are checked again.

  Status: OK, Misaligned (moved but still inside the opening, if set in Settings), Changed, Obsolete (no element left:
  the opening is kept). Mixed or nearby openings are split or joined according to Settings (status Split / Joined).
  Then choose whether to recreate the changed (and misaligned) openings or only update the statuses.
author: Matteo Maiorano
help_url: https://esaengineeringsrl.sharepoint.com/sites/BIMESA-Wiki/SitePages/PyESA.aspx
