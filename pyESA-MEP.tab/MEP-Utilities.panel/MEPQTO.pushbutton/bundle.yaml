title: "MEP\nQTO"
tooltip: >
  MEP quantity takeoff driven by Type Mark and price codes (type and instance parameters,
  remappable with Parameters...). Pieces are counted; ducts, pipes and insulation are
  measured in m, mq or kg according to the code unit; cable trays and conduits in m, with
  a fittings allowance (30% by default) that can be overridden per item.

  CLICK: choose the linked models, categories and worksets to read, then open the takeoff
  window. Link a shared price list (.json, .xlsx, .csv or PriMus .xpwe), set WBS levels
  and structure, and review the EPU, Bill of quantities (pivot by chapter, Type Mark or
  WBS), CME, Manual items, Type Marks and Rules tabs. Missing data is listed in the Issues
  tab.

  Everything typed is saved to <Model>_MEPQTO.json next to the central model, never to
  the model. Export Excel writes the same tables to a workbook.
author: ESA Engineering
