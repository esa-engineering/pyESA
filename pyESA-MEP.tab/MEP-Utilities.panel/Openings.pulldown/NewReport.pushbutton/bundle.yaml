title: New Report
tooltip: >-
  Checks the openings against their MEP elements and writes statuses and Ids (Valid, To Be Refreshed, Not
  Associated). Scope: whole model, MEP selection or ARC selection. The MEP elements of the report are also checked for
  crossings without an opening.

  Then a Text Report (export to Excel) or an Interactive Report to select elements and create, recreate, move or
  delete openings.
author: Matteo Maiorano
