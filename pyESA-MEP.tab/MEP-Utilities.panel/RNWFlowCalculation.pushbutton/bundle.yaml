title: "RNW Flow\nCalculation"
tooltip: >
  Rainwater network sizing. The rainwater fixtures write their design flow [l/s] in the
  Fixture Units of their connector and Revit sums it along the network: the Fixture Units
  value of every pipe is read as its design flow in l/s. The piping system type of the
  rainwater drainage is chosen from a dropdown; its pipes are checked in the whole model,
  in the active view or in the selection.

  Sloped horizontal pipes are checked against Table 6.3, 6.4 or 6.5 (fill degree 0.5, 0.6
  or 0.7, chosen in the dialog), using the table row with the next lower slope; 45 degree
  runs count as horizontal. Pipes steeper than 60 degrees are checked as vertical stacks
  against Table 6.2 (fill degree 0.33)
  for the chosen pipe series (PE, PP, Triplus, Silere). Sloped pipes are also checked for
  velocity (minimum and maximum set in the dialog) and fill degree at the design flow.

  CLICK: the results open in a window that follows the network from upstream to
  downstream: every branch starts at its fixture (with the flow of each fixture) and comes
  before the section it drains into. One row per section part, horizontal and
  vertical (System + Section parameter of the pipes): flow, nominal and outer diameter in the model, capacity,
  velocity, fill degree, suggested diameter and status. Pick the new size from a dropdown
  with the sizes of the pipe type (from the segments of its routing preferences): capacity,
  velocity, fill and check of the new size update at once. Tick the sections to resize
  (the undersized ones can be ticked in one click); Apply Changes sets the size on all the
  pipes of the ticked rows, after confirmation, one section at a time. Pipes always keep the
  calculated size. The fittings connected to them take the new size, as with the Diameter field
  of the options bar (connector size, or the family parameter tied to it, for example NR);
  where a resized fitting still meets a pipe that keeps its size, or a fitting cannot take the
  new size, a transition from the routing preferences of the pipe type is added, as Revit
  does. No fitting is deleted and no pipe is moved. A section that cannot be resized is rolled
  back and the others are kept. The
  report opens only at the end, and only if a section could not be resized.

  The search button of a row (or Select in Model) selects its pipes and lets you navigate
  the active view; Finish or Esc returns to the table as it was.

  SHIFT + CLICK: fitting test. Pick a fitting, a connector and a DN: the tool tries the connector
  size and the family parameter in a transaction that is rolled back, and reports what is
  connected to every connector after each attempt. The model is not changed.
author: ESA Engineering
