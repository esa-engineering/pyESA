title: Match Top
tooltip: >-
  CLICK: click a reference pipe, duct, cable tray or conduit, then select the elements to align and press Finish (or, with the single element option, click just one).
  Each element is moved vertically so that its upper end top elevation matches the one of the reference (plan
  position and length are kept). Vertical elements work both as reference (top end) and as aligned elements (moved as
  a whole).

  SHIFT + CLICK: settings shared by Match Top, Match Middle and Match Bottom: overwrite the reference level with the
  one of the reference element (on by default), remove the slope from the aligned elements (off by default), align a single element, with one click, instead of a multiple selection (off by default). Inline fittings and accessories connected to the ends (elbows, couplings, transitions, valves; not tees) always move with the element.

  No report: an alert with the first reason appears only if something could not be changed.
author: Matteo Maiorano
help_url: https://esaengineeringsrl.sharepoint.com/sites/BIMESA-Wiki/SitePages/PyESA.aspx
