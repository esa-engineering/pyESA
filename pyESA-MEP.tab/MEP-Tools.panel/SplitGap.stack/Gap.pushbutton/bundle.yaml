title: Gap
tooltip: >-
  Opens a gap in straight pipes, ducts, cable trays and conduits, one element at a time until ESC. No selection and no
  Finish: click the element at the first point of the gap, then click the second point on the same (highlighted)
  element. The piece in between is removed; a second point beyond the end of the element removes the whole rest
  of it, up to that end. ESC on the second click skips the element, ESC on the first click
  finishes.

  In plans, sections and elevations the clicks use Revit snaps; in 3D views both clicks are on the element. Vertical
  elements need a section, elevation or 3D view. Elements that cannot be cut are left unchanged, and an alert with the reason appears (no report).
  To cut the same gap in many elements at once use Multi Gap.
author: Matteo Maiorano
help_url: https://esaengineeringsrl.sharepoint.com/sites/BIMESA-Wiki/SitePages/PyESA.aspx
