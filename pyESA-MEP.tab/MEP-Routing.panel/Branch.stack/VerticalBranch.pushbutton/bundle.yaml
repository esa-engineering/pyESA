title: Vertical Branch
tooltip: >-
  Creates a horizontal branch from vertical runs of pipe, duct or cable tray, each category with its own window.
  Select the risers, then choose the side as seen on screen in the plan view, the elevation (level + offset) and the
  length. Pipes can also branch towards a point clicked in the view. Cable trays: from a narrow side the branch stays
  on edge with a tee; from a wide side it is flat and not connected. Along the riser a tee is placed; above or below
  its end the riser is extended and a tee is placed (curves are done by the Turn commands).

  PIPES: each branch can be one size smaller than the run (next nominal diameter of the pipe segment): checkbox in
  the pipe window. The junction chosen here (tee or tap) is also used by Horizontal Branch.

  A report lists the result. The new parts keep the parameters and the insulation of the starting element.
author: Matteo Maiorano
