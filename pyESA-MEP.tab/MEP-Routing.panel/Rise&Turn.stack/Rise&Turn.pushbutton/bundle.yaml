title: Comb
tooltip: >-
  Turns a row of horizontal pipes heading to a wall into a comb: each pipe reaches the wall, goes up or down with an
  elbow to its own elevation, then turns 90 degrees and runs along the wall, forming a stack with aligned ends. Select
  the pipes of the row, then click the wall to the left or right of the row (it sets the direction of the runs). A
  beam, a column or a curtain wall also work, in this model or in a linked RVT or IFC model.

  In the window choose the stack (below the row, above the row, or one pipe kept at its elevation with the others all
  up or all down), the spacing in the stack, the distance from the wall and the length along the wall. The pipe with
  the longest run takes the farthest elevation, so the risers never cross the runs.

  If an elbow does not fit, nothing is changed. A report lists the result. The new parts keep the parameters and the
  insulation of the starting element.
author: Matteo Maiorano
