title: Riser Down
tooltip: >-
  CLICK: adds a vertical run downwards from the free end nearest to your click, with an elbow, using the last settings
  (default 1000 mm).

  SHIFT + CLICK: set the height first, as a length or as a level (current view level or below) plus an offset.

  SHIFT + CLICK also sets the optional inclined run before the vertical one (angle and length).

  A report lists the new elements and their final elevation. The new parts keep the parameters and the insulation of
  the starting element.
author: Matteo Maiorano
