title: Setup
tooltip: >-
  Openings settings of this project, saved in the model: families (simple: one rectangular and one round family for
  walls and for floors; or a matrix by MEP type and case: wall / floor, normal / REI / structural, plus merged
  openings), names of the size parameters (height, width, depth, diameter) with a check of each family, REI rules (one
  or more parameters, with a test that counts the matching elements), sizing rules by class (clearance, rounding,
  merge distance, minimum size, extra depth), MEP categories, parameters to fill, what to do with the openings no
  longer needed.

  On OK it can also create the workset, the schedule and the view filters. Export / Import save and load the setup as
  a file, to reuse it in another project.
author: Matteo Maiorano
