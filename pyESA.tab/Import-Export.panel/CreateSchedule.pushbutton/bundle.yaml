title:
  en_us: Create\nSchedule
  it_it: Crea\nAbachi

tooltip: >
  Crea abachi (schedule) multipli, uno per ogni categoria selezionata.

  CLICK: selezione manuale di categorie e parametri (nativi, di progetto,
  condivisi). I parametri non disponibili per una categoria vengono
  segnalati nel report finale.

  SHIFT + CLICK: usa un abaco esistente come template e ne replica campi,
  ordinamento/raggruppamento e formattazione sulle categorie selezionate.

  In entrambe le modalita' il nome dell'abaco e' composto da un prefisso
  digitato dall'utente + il nome della categoria Revit.
