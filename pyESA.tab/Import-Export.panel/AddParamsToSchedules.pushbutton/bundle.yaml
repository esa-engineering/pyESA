title: |-
  Add Parameters
  to Schedule

tooltip: >
  Aggiunge uno o più parametri di progetto/condivisi come campi
  in una o più schedule selezionate.
  I parametri non disponibili per la categoria della singola schedule
  vengono saltati e riportati nel report finale.

author: ESA Engineering

