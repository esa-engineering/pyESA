title:
  Quantity

  Takeoff

tooltip: |
  Extracts geometric quantities from all model elements
  and exports them to CSV, with optional additional parameters.

  You can choose which documents to compute: the active document
  and/or one or more loaded Revit links (nested links included).

  The Source_Document column tells which model each row comes from
  (element IDs are unique only within their own document).

author: Claude + Antonio Miano
