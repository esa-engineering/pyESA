title:
  Elements

  in Room
tooltip: >
  Writes on a text parameter of the elements the value of a parameter read from the
  room that contains them, so that objects can be grouped by their actual spatial
  location. Doors and windows use From Room / To Room, family instances use the Room
  Calculation Point when the family has one, walls and room separators use the room
  boundaries, everything else is tested against the computed room volume. Doors and
  walls that get no answer are probed on both sides; when nothing answers, an optional
  tolerance (X, Y, Z up, Z down, in centimetres) probes the element point again a few
  centimetres away, either along the project axes or along the object's own axes.
  Rooms and elements can each be limited to the active view. Only elements that exist
  in the chosen element phase are processed. The parameter to write is chosen among
  the text parameters common to all the selected categories. When an element belongs
  to more than one room the values are joined with a separator.

  CLICK - rooms from the current document.

  SHIFT + CLICK - pick a loaded Revit link in the model (or select it before running)
  and read its rooms (the link transform is applied).
author: Antonio Miano
