title: "MEP\nAlign to Wall"
tooltip: >
  Aligns the selected MEP devices flush with the nearest vertical architectural partition,
  in plan only. Elevation is never changed.

  CLICK: select the devices, then run the command. A dialog asks which of the nine handled
  categories to process, the maximum distance from the partition face (30 cm by default)
  and whether to run a simulation first.

  Which of the two wall faces is decided by the family front, read from its Room
  Calculation Point, so a device facing the partition is carried across to the far face.
  Walls the device has alongside it are excluded. Where several wall instances touch, the
  target is the outermost face of the package. The device is finally squared up
  perpendicular to that face, by at most 5 degrees.

  Every selected element appears in the report with its own outcome and reason: nothing is
  ignored silently. Devices beyond the tolerance, hosted by a wall, pinned, inside a group
  or in an inactive design option are left untouched and listed.
author: ESA Engineering
