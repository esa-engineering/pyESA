title: Branch
tooltip: >-
  CLICK: creates a horizontal or inclined branch from vertical runs of pipe, duct or cable tray (cable trays: only
  from the narrow side). Select the risers, then choose the side as seen on screen in the plan view, the elevation
  (level + offset), the length and the angle of the branch. Along the riser a tee is placed; above or below its end
  you choose between an elbow and extending the riser with a tee.

  SHIFT + CLICK: Y branch on vertical pipes with the fitting e_PP.GG.JN_Y Branch. Choose the side, the angle (15, 30,
  45 or 60 degrees), the elevation of the horizontal run (level + offset), its distance from the riser and its
  length. The horizontal run is drawn first, then joined to the riser with an inclined run and the Y branch. If the
  Y branch falls outside the pipe, the pipe is extended first.

  A report lists the result. The new parts keep the parameters and the insulation of the starting element.
author: Matteo Maiorano
