title: Overpass
tooltip: >-
  CLICK: select pipes, ducts or cable trays; the tool checks clashes with other MEP elements and lets you pass over,
  under or leave each one, with a clearance from the obstacle and the angle of the rises and drops. With no clashes
  left, click a point to extend the runs to it; the check runs again after each extension. ESC to finish.

  SHIFT + CLICK: makes a straight horizontal run of pipe, duct, cable tray or conduit go up or down between two points
  you click, with two vertical or inclined legs and four elbows. The offset is relative to the current run and the leg
  angle is measured from the horizontal.

  A report lists the result. The new parts keep the parameters and the insulation of the starting element.
author: Matteo Maiorano
