title: Turn Left
tooltip: >-
  CLICK: adds a run that turns left from the free end nearest to your click, with an elbow, using the saved settings
  (default 1000 mm, 90 degrees, same slope as the original run).
  SHIFT + CLICK: change length, turn angle and slope option. Settings are shared with Turn Right.
  The new parts keep the parameters and the insulation of the starting element.
author: Matteo Maiorano
